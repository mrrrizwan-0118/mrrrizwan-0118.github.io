<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CalX | Mir Rizwan</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#f1f2f4;
  --card:#ffffff;
  --text:#151515;
  --muted:#777;
  --button:#f8f8f8;
  --button2:#eeeeef;
  --border:rgba(0,0,0,.08);
  --accent:#8883d8;
  --accent2:#7772cf;
  --shadow:0 8px 30px rgba(0,0,0,.10);
}

body.dark{
  --bg:#070b18;
  --card:#10172a;
  --text:#fff;
  --muted:#9da5b8;
  --button:#172136;
  --button2:#202b42;
  --border:rgba(255,255,255,.08);
  --accent:#8c86e8;
  --accent2:#746ed1;
  --shadow:0 10px 35px rgba(0,0,0,.35);
}

body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  transition:.25s;
}

button,
select,
input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
  color:var(--text);
}

.app{
  min-height:100vh;
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:16px;
}

/* TOP BAR */

.topbar{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.top-left,
.top-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.icon-btn{
  width:44px;
  height:44px;
  border-radius:14px;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  transition:.2s;
}

.icon-btn:hover{
  background:var(--button2);
}

.icon-btn.active{
  background:var(--button2);
  color:var(--accent);
}

.brand{
  font-size:21px;
  font-weight:800;
}

/* DISPLAY */

.display{
  min-height:190px;
  padding:25px 12px 20px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:flex-end;
  overflow:hidden;
}

.expression{
  width:100%;
  text-align:right;
  color:var(--muted);
  font-size:20px;
  min-height:30px;
  word-break:break-all;
}

.result{
  width:100%;
  text-align:right;
  font-size:clamp(48px,9vw,78px);
  font-weight:500;
  line-height:1.05;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* BUTTON GRID */

.calculator{
  width:100%;
}

.buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.btn{
  min-height:82px;
  border-radius:28px;
  background:var(--button);
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.8),
    0 2px 8px rgba(0,0,0,.04);
  font-size:28px;
  font-weight:600;
  transition:transform .08s,background .15s;
}

.btn:hover{
  background:var(--button2);
}

.btn:active{
  transform:scale(.94);
}

.btn.function{
  font-size:23px;
}

.btn.operator{
  background:var(--button2);
}

.btn.equal{
  background:var(--accent);
  color:white;
}

.btn.clear{
  font-size:22px;
}

.zero{
  grid-column:span 2;
}

/* SCIENTIFIC */

.scientific{
  display:none;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin-bottom:12px;
}

body.scientific-mode .scientific{
  display:grid;
}

body.scientific-mode .buttons{
  grid-template-columns:repeat(5,1fr);
}

body.scientific-mode .zero{
  grid-column:auto;
}

.scientific .btn{
  min-height:70px;
  border-radius:25px;
  font-size:21px;
}

.angle.active{
  color:var(--accent);
  font-weight:800;
}

/* FOOTER */

.footer{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  padding:18px 0 8px;
}

/* PAGES */

.page{
  display:none;
}

.page.active{
  display:block;
}

.page-title{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:28px;
  font-weight:800;
  margin:18px 0 25px;
}

.back{
  width:45px;
  height:45px;
  border-radius:15px;
  background:var(--button);
  font-size:25px;
}

/* CONVERTER */

.converter-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.converter-card{
  min-height:190px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:25px;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:18px;
  font-size:22px;
  font-weight:700;
  transition:.2s;
}
    .converter-card:hover{
  transform:translateY(-3px);
}

.converter-icon{
  font-size:45px;
}

/* CONVERTER SCREEN */

.converter-screen{
  background:var(--card);
  border-radius:28px;
  padding:22px;
  box-shadow:var(--shadow);
}

.converter-screen h2{
  margin-bottom:20px;
}

.converter-input{
  width:100%;
  padding:18px;
  border:1px solid var(--border);
  border-radius:18px;
  background:var(--button);
  color:var(--text);
  outline:none;
  font-size:25px;
}

.select-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin:15px 0;
}

.converter-select{
  width:100%;
  padding:16px;
  border:1px solid var(--border);
  border-radius:16px;
  background:var(--button);
  color:var(--text);
  outline:none;
}

.convert-result{
  margin-top:18px;
  padding:20px;
  border-radius:20px;
  background:var(--button2);
  font-size:25px;
  font-weight:700;
}

/* HISTORY */

.history-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.history-item{
  background:var(--card);
  border:1px solid var(--border);
  padding:18px;
  border-radius:18px;
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.history-expression{
  color:var(--muted);
}

.history-result{
  font-weight:700;
}

/* SETTINGS */

.settings-list{
  background:var(--card);
  border-radius:25px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.setting{
  min-height:70px;
  padding:18px 20px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.setting:last-child{
  border-bottom:0;
}

.setting-title{
  font-size:18px;
  font-weight:700;
}

.setting-sub{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

/* SWITCH */

.switch{
  width:52px;
  height:30px;
  border-radius:20px;
  background:#aaa;
  padding:3px;
  transition:.2s;
}

.switch span{
  display:block;
  width:24px;
  height:24px;
  background:white;
  border-radius:50%;
  transition:.2s;
}

.switch.on{
  background:var(--accent);
}

.switch.on span{
  transform:translateX(22px);
}

/* MENU */

.menu{
  position:fixed;
  top:75px;
  right:18px;
  width:240px;
  background:var(--card);
  border-radius:20px;
  box-shadow:0 15px 45px rgba(0,0,0,.2);
  padding:8px;
  display:none;
  z-index:100;
}

.menu.show{
  display:block;
}

.menu-item{
  width:100%;
  padding:17px;
  background:transparent;
  border-radius:14px;
  text-align:left;
  font-size:17px;
  font-weight:700;
}

.menu-item:hover{
  background:var(--button2);
}

/* DESKTOP */

@media(min-width:800px){
  .app{
    padding:18px 28px;
  }

  .display{
    min-height:240px;
  }

  .btn{
    min-height:92px;
  }

  .calculator{
    max-width:850px;
    margin:auto;
  }
}

/* MOBILE */

@media(max-width:650px){
  .app{
    padding:8px 12px 12px;
  }

  .topbar{
    height:52px;
  }

  .icon-btn{
    width:40px;
    height:40px;
  }

  .display{
    min-height:250px;
  }

  .result{
    font-size:55px;
  }

  .buttons{
    gap:10px;
  }

  .btn{
    min-height:74px;
    border-radius:25px;
    font-size:27px;
  }

  .scientific{
    gap:8px;
  }

  .scientific .btn{
    min-height:62px;
    border-radius:22px;
    font-size:17px;
  }

  .converter-grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .converter-card{
    min-height:155px;
    border-radius:22px;
    font-size:18px;
  }

  .converter-icon{
    font-size:36px;
  }

  .page-title{
    font-size:25px;
  }
}

@media(max-width:380px){
  .btn{
    min-height:67px;
  }

  .display{
    min-height:220px;
  }

  .result{
    font-size:48px;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- MAIN CALCULATOR -->

<section id="calculatorPage" class="page active">

  <div class="topbar">

    <div class="top-left">

      <!-- SCIENTIFIC SWITCH -->
      <button class="icon-btn" id="modeBtn"
              title="Normal / Scientific"

        √ π

              title="Menu"

        ⋮
      </button>

    </div>

  </div>

  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
  </div>

  <!-- SCIENTIFIC BUTTONS -->

  <div class="scientific">

    <button class="btn function" onclick="scientificFunction('sin')">sin</button>
    <button class="btn function" onclick="scientificFunction('cos')">cos</button>
    <button class="btn function" onclick="scientificFunction('tan')">tan</button>

    <button class="btn function angle active"
            id="radBtn"
            onclick="setAngle('rad')">
      rad
    </button>

    <button class="btn function angle"
            id="degBtn"
            onclick="setAngle('deg')">
      deg
    </button>

    <button class="btn function" onclick="scientificFunction('log')">log</button>
    <button class="btn function" onclick="scientificFunction('ln')">ln</button>
    <button class="btn function" onclick="addValue('(')">(</button>
    <button class="btn function" onclick="addValue(')')">)</button>
    <button class="btn function" onclick="scientificFunction('inv')">inv</button>

    <button class="btn function" onclick="scientificFunction('factorial')">!</button>
    <button class="btn function" onclick="addValue('^')">^</button>
    <button class="btn function" onclick="scientificFunction('sqrt')">√</button>
    <button class="btn function" onclick="addValue('π')">π</button>
    <button class="btn function" onclick="addValue('e')">e</button>

  <!-- NORMAL BUTTONS -->

  <div class="buttons">

    <button class="btn operator" onclick="addValue('÷')">÷</button>

    <button class="btn" onclick="addValue('7')">7</button>
    <button class="btn" onclick="addValue('8')">8</button>
    <button class="btn" onclick="addValue('9')">9</button>

    <button class="btn" onclick="addValue('4')">4</button>
    <button class="btn" onclick="addValue('5')">5</button>
    <button class="btn" onclick="addValue('6')">6</button>
    <button class="btn operator" onclick="addValue('-')">−</button>

    <button class="btn" onclick="addValue('1')">1</button>
    <button class="btn" onclick="addValue('2')">2</button>
    <button class="btn" onclick="addValue('3')">3</button>
    <button class="btn operator" onclick="addValue('+')">+</button>

<script>

/* =========================
    CALCULATOR
========================= */

let expression = "";
let angleMode = "rad";

const resultEl = document.getElementById("result");
const expressionEl = document.getElementById("expression");

function updateDisplay(){
  expressionEl.textContent = expression;
resultEl.textContent = expression || "0";  
}

function addValue(value){

  if(expression === "Error"){
    expression="";
  }

  expression += value;
  updateDisplay();
}

function clearAll(){
  expression="";
  expressionEl.textContent="";
  resultEl.textContent="0";
}

function backspace(){
  expression=expression.slice(0,-1);
  updateDisplay();
}

function percent(){

  if(!expression) return;

  try{
    let value=evalExpression(expression);
    expression=String(value/100);
    updateDisplay();
  }catch{
    resultEl.textContent="Error";
  }
}

function calculate(){

  if(!expression) return;

  try{

    const original=expression;
    const value=evalExpression(expression);

    const formatted=formatNumber(value);

    resultEl.textContent=formatted;
    expressionEl.textContent=original+" =";

    saveHistory(original,formatted);

    expression=formatted;

  }catch(error){

    resultEl.textContent="Error";

  }
}

function formatNumber(value){

  if(!Number.isFinite(value)){
    throw new Error("Invalid");
  }

  if(Math.abs(value)<1e-12) value=0;

  return Number(value.toPrecision(12)).toString();
}


/* =========================
   SAFE EXPRESSION ENGINE
========================= */

function evalExpression(exp){

  let e=exp;

  e=e.replaceAll("×","*");
  e=e.replaceAll("÷","/");
  e=e.replaceAll("−","-");
  e=e.replaceAll("π",String(Math.PI));
  e=e.replace(/\be\b/g,String(Math.E));
  e=e.replace(/\^/g,"**");

  /*
    Only mathematical characters/operators
  */

  if(!/^[0-9+\-*/().\s*eE]+$/.test(e)){
    throw new Error("Invalid expression");
  }

  /*
    Function constructor is used only after
    strict character filtering above.
  */

  const value=Function('"use strict";return ('+e+')')();

  return value;
}


/* =========================
   SCIENTIFIC
========================= */

function toggleScientific(){

  document.body.classList.toggle("scientific-mode");

  const active=document.body.classList.contains("scientific-mode");

  document.getElementById("modeBtn").classList.toggle("active",active);

}

function setAngle(mode){

  angleMode=mode;

  document.getElementById("radBtn").classList.toggle(
    "active",mode==="rad"
  );

  document.getElementById("degBtn").classList.toggle(
    "active",mode==="deg"
  );
}

function getAngle(value){

  if(angleMode==="deg"){
    return value*Math.PI/180;
  }

  return value;
}

function scientificFunction(type){

  try{

    let value=evalExpression(expression || "0");
    let result;

    switch(type){

      case "sin":
        result=Math.sin(getAngle(value));
        break;

      case "cos":
        result=Math.cos(getAngle(value));
        break;

      case "tan":
        result=Math.tan(getAngle(value));
        break;

      case "log":
        result=Math.log10(value);
        break;

      case "ln":
        result=Math.log(value);
        break;

      case "sqrt":
        result=Math.sqrt(value);
        break;

      case "inv":
        result=1/value;
        break;

      case "factorial":
        result=factorial(value);
        break;

      default:
        return;
    }

    expression=formatNumber(result);
    updateDisplay();

  }catch{

    resultEl.textContent="Error";

  }
}

function factorial(n){

  if(n<0 || !Number.isInteger(n)){
    throw new Error("Invalid factorial");
  }

  if(n>170){
    throw new Error("Too large");
  }

  let result=1;

  for(let i=2;i<=n;i++){
    result*=i;
  }

  return result;
}


/* =========================
   FULLSCREEN
========================= */

async function toggleFullscreen(){

  try{

    if(!document.fullscreenElement){

      if(document.documentElement.requestFullscreen){
        await document.documentElement.requestFullscreen();
      }else{
        document.body.classList.add("fake-fullscreen");
      }
    }else{

      if(document.exitFullscreen){
        await document.exitFullscreen();
      }

    }

  }catch(error){

    document.body.classList.remove("fake-fullscreen");

  }
}

/* =========================
   NAVIGATION / MENU / HISTORY / CONVERTERS
========================= */
const pageIds=['calculatorPage','converterPage','converterToolPage','historyPage','settingsPage'];
function showPage(id){pageIds.forEach(x=>{const el=document.getElementById(x);if(el)el.classList.toggle('active',x===id);});const menu=document.getElementById('menu');if(menu)menu.classList.remove('show');}
function showCalculator(){showPage('calculatorPage');}
function showConverter(){showPage('converterPage');}
function showHistory(){showPage('historyPage');renderHistory();}
function showSettings(){showPage('settingsPage');}
function toggleMenu(){const menu=document.getElementById('menu');if(menu)menu.classList.toggle('show');}
document.addEventListener('click',e=>{const menu=document.getElementById('menu');const btn=e.target.closest('button[title="Menu"]');if(menu&&!menu.contains(e.target)&&!btn)menu.classList.remove('show');});
function getHistory(){try{return JSON.parse(localStorage.getItem('calxHistory')||'[]');}catch{return [];}}
function saveHistory(original,formatted){const h=getHistory();h.unshift({expression:original,result:formatted,time:Date.now()});localStorage.setItem('calxHistory',JSON.stringify(h.slice(0,50)));}
function renderHistory(){const list=document.getElementById('historyList');if(!list)return;const h=getHistory();if(!h.length){list.innerHTML='<div class="history-item"><span class="history-expression">No calculations yet</span></div>';return;}list.innerHTML=h.map((x,i)=>`<button class="history-item" type="button" onclick="useHistory(${i})"><span><span class="history-expression">${escapeHtml(x.expression)} =</span><br><span class="history-result">${escapeHtml(x.result)}</span></span><span class="history-expression">${new Date(x.time).toLocaleString()}</span></button>`).join('');}
function useHistory(i){const h=getHistory();if(!h[i])return;expression=h[i].result;updateDisplay();showCalculator();}
function clearHistory(){localStorage.removeItem('calxHistory');renderHistory();}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function toggleTheme(){document.body.classList.toggle('dark');const dark=document.body.classList.contains('dark');localStorage.setItem('calxDark',dark?'1':'0');const sw=document.getElementById('themeSwitch');if(sw)sw.classList.toggle('on',dark);}
(function(){if(localStorage.getItem('calxDark')==='1'){document.body.classList.add('dark');const sw=document.getElementById('themeSwitch');if(sw)sw.classList.add('on');}})();
const converterData={length:{title:'Length',units:{Meter:1,Kilometer:1000,Centimeter:.01,Millimeter:.001,Mile:1609.344,Yard:.9144,Foot:.3048,Inch:.0254}},area:{title:'Area',units:{'Square meter':1,'Square kilometer':1e6,'Square centimeter':1e-4,'Square foot':.09290304,'Square inch':.00064516,Acre:4046.8564224,Hectare:10000}},volume:{title:'Volume',units:{Liter:1,Milliliter:.001,'Cubic meter':1000,'Cubic centimeter':.001,Gallon:3.785411784,'Cubic foot':28.316846592}},weight:{title:'Weight',units:{Kilogram:1,Gram:.001,Milligram:.000001,Pound:.45359237,Ounce:.028349523125,Tonne:1000}},temperature:{title:'Temperature',units:['Celsius','Fahrenheit','Kelvin']},speed:{title:'Speed',units:{'m/s':1,'km/h':.2777777778,mph:.44704,knot:.5144444444}},pressure:{title:'Pressure',units:{Pascal:1,Kilopascal:1000,Bar:100000,Atmosphere:101325,PSI:6894.757293}},power:{title:'Power',units:{Watt:1,Kilowatt:1000,Megawatt:1000000,Horsepower:745.6998716}},number:{title:'Number System',units:['Decimal','Binary','Octal','Hexadecimal']},currency:{title:'Currency',units:['INR','USD','EUR','GBP','AED','JPY'],rates:{INR:1,USD:.0118,EUR:.0108,GBP:.0093,AED:.0434,JPY:1.75}}};
let currentConverter=null;
function openConverter(type){const d=converterData[type];if(!d)return;currentConverter=type;document.getElementById('converterTitle').textContent=d.title;const f=document.getElementById('fromUnit'),t=document.getElementById('toUnit');const units=Array.isArray(d.units)?d.units:Object.keys(d.units);f.innerHTML=units.map(u=>`<option value="${escapeHtml(u)}">${escapeHtml(u)}</option>`).join('');t.innerHTML=units.map(u=>`<option value="${escapeHtml(u)}">${escapeHtml(u)}</option>`).join('');if(units.length>1)t.selectedIndex=1;document.getElementById('convertInput').value='';document.getElementById('convertResult').textContent='Enter a value';showPage('converterToolPage');}
function performConversion(){if(!currentConverter)return;const raw=document.getElementById('convertInput').value,r=document.getElementById('convertResult');if(raw===''){r.textContent='Enter a value';return;}const value=Number(raw);if(!Number.isFinite(value)){r.textContent='Invalid value';return;}const from=document.getElementById('fromUnit').value,to=document.getElementById('toUnit').value;let result;try{if(currentConverter==='temperature'){let c=from==='Celsius'?value:from==='Fahrenheit'?(value-32)*5/9:value-273.15;result=to==='Celsius'?c:to==='Fahrenheit'?c*9/5+32:c+273.15;}else if(currentConverter==='number'){let dec=from==='Decimal'?parseInt(String(value),10):from==='Binary'?parseInt(String(value),2):from==='Octal'?parseInt(String(value),8):parseInt(String(value),16);if(!Number.isInteger(dec))throw Error();const bases={Decimal:10,Binary:2,Octal:8,Hexadecimal:16};result=dec.toString(bases[to]).toUpperCase();}else if(currentConverter==='currency'){const rates=converterData.currency.rates;result=value/rates[from]*rates[to];}else{const u=converterData[currentConverter].units;result=value*u[from]/u[to];}if(typeof result==='number')result=Number(result.toPrecision(12)).toString();r.textContent=`${result} ${to}`;}catch{r.textContent='Invalid conversion';}}

</script>

</body>
